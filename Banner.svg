<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Ritesh Singh - Secure systems. Smart models." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#133052"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" rx="16" fill="url(#bg)"/>
  <circle cx="800" cy="200" r="170" fill="#60a5fa" opacity="0.10"/>
  <circle cx="860" cy="40" r="90" fill="#5eead4" opacity="0.07"/>

  <!-- window dots -->
  <circle cx="34" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="32" r="6" fill="#27c93f"/>
  <text x="104" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7c8ba1">ritesh@mumbai:~$</text>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#1f3350" stroke-width="1"/>

  <!-- name -->
  <text x="48" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#ac)">Ritesh Singh</text>

  <!-- tagline + blinking cursor (cursor sits right after the text, whatever the font) -->
  <text x="50" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#cbd5e1">Secure systems. Smart models.<tspan fill="#5eead4" dx="4">▌<animate attributeName="fill" values="#5eead4;#5eead4;#00000000;#00000000" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <text x="50" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7c8ba1">final-year computer engineering  ·  graduating 2027</text>
</svg>